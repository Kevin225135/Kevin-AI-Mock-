description: AI Mock V2 deterministic scoring regression baseline

prompts:
  - "{{answer}}"

providers:
  - id: file://scoring-provider.ts
    label: Local rubric scorer

defaultTest:
  metadata:
    datasetType: synthetic-regression
    rubricCode: v1_text_mock_rubric
    rubricVersion: 2
  assert:
    - type: javascript
      metric: score-schema
      value: 'Number.isInteger(JSON.parse(output).totalScore) && JSON.parse(output).totalScore >= 0 && JSON.parse(output).totalScore <= 100 && ["starCompleteness", "logicStructure", "contentDepth", "communication"].every((key) => Number.isInteger(JSON.parse(output).dimensions[key]) && JSON.parse(output).dimensions[key] >= 1 && JSON.parse(output).dimensions[key] <= 5) && Array.isArray(JSON.parse(output).deductions) && Array.isArray(JSON.parse(output).improvements)'

tests:
  - description: Strong behavioral answer receives a usable score
    vars:
      module: BEHAVIORAL
      question: 请介绍一次你推动产品指标改善的经历。
      answer: 我的结论是注册转化率提升了18%。我主导漏斗分析，发现验证邮件流失最高；随后设计A/B实验并协调研发上线。两周后转化率从42%提升到49.6%，同时复盘了样本量不足的风险。
    assert:
      - type: javascript
        metric: strong-answer-band
        value: JSON.parse(output).totalScore >= 70

  - description: Vague answer stays below the strong band
    vars:
      module: BEHAVIORAL
      question: 请介绍一次你推动产品指标改善的经历。
      answer: 我参与了一个项目，和大家一起做了很多工作，最后效果还可以，也学到了不少东西。
    assert:
      - type: javascript
        metric: vague-answer-band
        value: JSON.parse(output).totalScore < 70

  - description: Technical answer is judged by technical depth instead of forced STAR
    vars:
      module: TECHNICAL
      question: 你会如何设计一个可回放的 LLM 评测系统？
      answer: 核心方案是冻结数据集、Prompt和Rubric版本。执行层记录输入引用、模型版本、延迟、Token与错误分类；评测层分别计算Schema通过率、检索Recall@K和人工校准差异。风险包括数据泄漏与Judge漂移，因此需要时间切分、盲评和版本回归。
    assert:
      - type: javascript
        metric: technical-depth
        value: 'JSON.parse(output).dimensions.contentDepth >= JSON.parse(output).dimensions.starCompleteness && JSON.parse(output).totalScore >= 65'

  - description: Market answer retains counter-evidence and invalidation conditions
    vars:
      module: MARKET
      question: 你如何判断生成式 AI 面试产品的市场机会？
      answer: 我的观点是需求存在但留存是关键约束。依据是求职高频且反馈稀缺，传导机制是更短反馈周期提升练习频次；反方因素包括免费内容和低付费意愿。若7日复测率低于目标或重答后无改善，我会判定当前闭环未被验证。
    assert:
      - type: javascript
        metric: market-reasoning
        value: JSON.parse(output).dimensions.contentDepth >= 3
